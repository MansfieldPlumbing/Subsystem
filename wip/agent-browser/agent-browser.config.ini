# agent-browser per-page HUD shaping (ported from firefox.config.ini; WebView2 element labels).
#   name | match(regex) | hide(-like) | keep(-like whitelist) | strip(regex line) |
#   keep_after/keep_until(regex) | max_text(int) | intent <name> = <-like> | expect(-like staleness)

[*]
max_text = 4000

[google.com/ai]
name  = google.com/ai
match = google\.com/search.*udm=50
match = google\.com/ai
keep_after = .*You said:\s*\r?\n.*?\r?\n
keep_until = AI can make mistakes|AI Mode response is ready
keep  = Ask anything
keep  = Start a new AI Mode search
keep  = *Opens in new tab*
intent ask = Ask anything
intent new_thread = Start a new AI Mode search
expect = Ask anything
strip = ^Skip to main content$
strip = ^Accessibility help$
strip = ^AI Mode$
strip = ^All$
strip = ^Images$
strip = ^Videos$
strip = ^News$
strip = ^More$
strip = ^Sign in$
strip = ^Search Results$

[chatgpt.com]
name  = chatgpt.com
match = ^https://chatgpt\.com
match = ^https://chat\.openai\.com
keep  = Chat with ChatGPT
keep  = Send prompt
keep  = *llama*
intent ask = Chat with ChatGPT
intent send = Send prompt
expect = Chat with ChatGPT
strip = ^Skip to content$
strip = ^ChatGPT$
strip = ^Log in$
strip = ^Where should we begin\?$
strip = ^ChatGPT is AI.*$
strip = ^Sponsored$
strip = ^There.s coding with AI.*$
strip = ^Go from prompt to PR.*$
strip = ^Voice$
