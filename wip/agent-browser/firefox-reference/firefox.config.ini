# Per-page HUD shaping for firefox.work.ps1.
# [section]  -> a page identity
#   name     = friendly label shown in the HUD (replaces the long mutated URL)
#   match    = regex tested against the live URL (repeatable; first hit wins)
#   hide     = -like pattern; any intent whose label matches is dropped (repeatable)
#   keep     = -like whitelist; if set, ONLY matching intents show (repeatable)
#   strip    = regex; drop any TEXT line matching (repeatable)
#   max_text = cap chars per HUD view; page the rest with /nextchunk (chunk N)

[*]
# Global default: cap long token-burning pages. Per-page max_text overrides this.
max_text = 4000

[google.com/ai]
name  = google.com/ai
match = google\.com/search.*udm=50
match = google\.com/ai
# Text shaping: isolate the FINAL AI answer (after the last echoed prompt) + sources,
# and drop the streamed duplicate, nav chrome, and disclaimers.
keep_after = .*You said:\s*\r?\n.*?\r?\n
keep_until = AI can make mistakes|AI Mode response is ready
# Intent whitelist: the only controls that matter on a Q&A page are continue + reset,
# plus the real cited article links. Everything else (Copy/Edit/View related links/
# N sites/Show all/publisher buttons) is noise the answer text already cites inline.
keep = Ask anything
keep = New thread
keep = *Opens in new tab*
strip = ^Skip to main content$
strip = ^Accessibility help$
strip = ^AI Mode$
strip = ^All$
strip = ^Images$
strip = ^Videos$
strip = ^News$
strip = ^More$
strip = ^Sign in$
strip = ^Search Results$
hide  = Skip to main content
hide  = Accessibility help
hide  = Go to Google home
hide  = AI Mode
hide  = All
hide  = Images
hide  = Videos
hide  = News
hide  = More
hide  = Settings
hide  = Google apps
hide  = Sign in
hide  = AI Mode history
hide  = Copy
hide  = Edit
hide  = Share
hide  = Good response
hide  = Bad response
hide  = About this result
hide  = Copy text
hide  = View related links
hide  = More input options
hide  = Show all related links
hide  = Ask about
hide  = 3 sites
hide  = 1 site
hide  = Facebook*
hide  = Copy What*
hide  = Edit What*

[chatgpt.com]
name  = chatgpt.com
match = ^https://chatgpt\.com
match = ^https://chat\.openai\.com
# NOTE: composer is ProseMirror (contenteditable). /dismiss removes the Google One Tap
# popup. Shape strips the sidebar nav.
strip = ^Skip to content$
strip = ^Search chats$
strip = ^Chat history$
strip = ^New chat$
strip = ^Images$
strip = ^Apps$
strip = ^Deep research$
strip = ^See plans and pricing$
strip = ^Settings$
strip = ^Help$
strip = ^Get responses tailored to you$
strip = ^Log in.*$
strip = ^Sign up for free$
strip = ^Ctrl$
strip = ^Shift$
strip = ^O$
hide  = Skip to content
hide  = Open sidebar
